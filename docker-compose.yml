# OPTIONAL: porneste PostgreSQL intr-un container Docker, in loc de o instalare locala.
# Utilizatorul, parola si numele bazei sunt aceleasi ca in apps/api/.env.example,
# deci aplicatia functioneaza identic cu ambele variante.
#
#   docker compose up -d     # porneste baza de date
#   docker compose down      # o opreste (datele raman in volumul `pgdata`)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ro_a11y
      POSTGRES_PASSWORD: ro_a11y
      POSTGRES_DB: ro_a11y
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ro_a11y -d ro_a11y']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
